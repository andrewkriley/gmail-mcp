[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmail-mcp"
version = "0.1.0"
description = "MCP server for Gmail with OAuth 2.0 and read/write Gmail API tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=1.27.0",
    "google-api-python-client>=2.193.0",
    "google-auth-oauthlib>=1.3.0",
    "google-auth-httplib2>=0.2.0",
]

[project.scripts]
gmail-mcp = "gmail_mcp.__main__:main"
gmail-mcp-setup = "gmail_mcp.setup_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["gmail_mcp"]

[tool.hatch.build.targets.sdist]
include = ["gmail_mcp", "README.md", "pyproject.toml"]
